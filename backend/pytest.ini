[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    live: hits a real, billed third-party API (e.g. Replicate). Excluded by
        default — run explicitly with `pytest -m live` when you intend to
        spend provider credits and have real credentials configured. Never
        run this marker in an unattended CI pipeline.
# Deselect `live` tests by default so a normal `pytest` invocation (CI or
# local) can never accidentally make a real, billed call to a third-party
# video-generation API just because credentials happen to be present in the
# environment. To run a live smoke test on purpose: pytest -m live
addopts = -m "not live"
