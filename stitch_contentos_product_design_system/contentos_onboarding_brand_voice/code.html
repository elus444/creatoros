<style>

        input[type=range]::-webkit-slider-thumb {

            width: 24px;
            border-radius: 50%;

<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md md:p-lg relative overflow-hidden text-on-surface">

<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-secondary tracking-wider uppercase">Step 3 of 5</span>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">

</div>
<!-- Minimal Progress Bar -->

<div class="h-full flex-1 bg-primary rounded-full"></div>

</div>
<div class="h-full flex-1 bg-surface-container-high rounded-full"></div>
<div class="h-full flex-1 bg-surface-container-high rounded-full"></div>
</div>
</header>

<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg font-bold text-on-surface mb-xs flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="tune" style="font-variation-settings: 'FILL' 1;">tune</span>

<p class="font-body-lg text-body-lg text-on-surface-variant">

<fieldset>

</legend>
<div class="flex flex-wrap gap-sm" id="tone-chips">
<!-- Simulated Radio Buttons disguised as chips -->
<label class="cursor-pointer group">
<input checked="" class="peer sr-only" name="tone" type="radio" value="professional">
<span class="inline-block px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-body-md text-body-md transition-all duration-200 peer-checked:bg-primary-container peer-checked:border-primary peer-checked:text-on-primary-container peer-checked:font-medium group-hover:not(.peer-checked):bg-surface-container-low group-hover:not(.peer-checked):text-on-surface">

<!-- Simple script to make the slider fill width update visually in the mockup -->
<script>
        const slider = document.getElementById('personality-slider');
        const fill = document.getElementById('slider-fill');
        
        if(slider && fill) {
            slider.addEventListener('input', (e) => {
                const value = e.target.value;
                const min = e.target.min || 1;
                const max = e.target.max || 5;
                const percentage = ((value - min) / (max - min)) * 100;
                fill.style.width = `${percentage}%`;
            });
        }
    </script>
