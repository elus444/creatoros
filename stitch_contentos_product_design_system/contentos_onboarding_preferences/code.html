<div class="p-xl">

<p class="font-body-lg text-body-lg text-on-surface-variant">Tell us what you want to create and where you'll be posting.</p>
</div>
<form class="space-y-lg">
<!-- Content Format Grid -->
<div class="space-y-sm">
<label class="font-headline-sm text-headline-sm block text-on-surface">Content Format</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-md">
<label class="cursor-pointer group">
<input class="peer sr-only" name="format" type="checkbox" value="video">
<div class="border border-outline-variant rounded-lg p-md flex flex-col items-center justify-center gap-sm transition-all duration-200 hover:bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:shadow-[0_0_0_2px_rgba(33,112,228,0.1)] h-24">
<span class="material-symbols-outlined text-outline group-hover:text-primary peer-checked:text-primary" style="font-variation-settings: 'FILL' 0;">movie</span>
<span class="font-label-md text-label-md text-on-surface-variant peer-checked:text-on-surface text-center">Short-form Video</span>
</div>
</label>
<label class="cursor-pointer group">
<input class="peer sr-only" name="format" type="checkbox" value="thread">
<div class="border border-outline-variant rounded-lg p-md flex flex-col items-center justify-center gap-sm transition-all duration-200 hover:bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:shadow-[0_0_0_2px_rgba(33,112,228,0.1)] h-24">
<span class="material-symbols-outlined text-outline group-hover:text-primary peer-checked:text-primary" style="font-variation-settings: 'FILL' 0;">forum</span>
<span class="font-label-md text-label-md text-on-surface-variant peer-checked:text-on-surface text-center">Thread</span>
</div>
</label>
<label class="cursor-pointer group">
<input class="peer sr-only" name="format" type="checkbox" value="article">
<div class="border border-outline-variant rounded-lg p-md flex flex-col items-center justify-center gap-sm transition-all duration-200 hover:bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:shadow-[0_0_0_2px_rgba(33,112,228,0.1)] h-24">
<span class="material-symbols-outlined text-outline group-hover:text-primary peer-checked:text-primary" style="font-variation-settings: 'FILL' 0;">article</span>
<span class="font-label-md text-label-md text-on-surface-variant peer-checked:text-on-surface text-center">Article</span>
</div>
</label>
<label class="cursor-pointer group">
<input class="peer sr-only" name="format" type="checkbox" value="newsletter">
<div class="border border-outline-variant rounded-lg p-md flex flex-col items-center justify-center gap-sm transition-all duration-200 hover:bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:shadow-[0_0_0_2px_rgba(33,112,228,0.1)] h-24">
<span class="material-symbols-outlined text-outline group-hover:text-primary peer-checked:text-primary" style="font-variation-settings: 'FILL' 0;">mail</span>
<span class="font-label-md text-label-md text-on-surface-variant peer-checked:text-on-surface text-center">Newsletter</span>
</div>
</label>
</div>

</select>

</div>
</label>
<label class="flex-1 cursor-pointer group">
