<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes soft-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(33, 112, 228, 0.4); /* primary-container approx */
            }
            70% {
                box-shadow: 0 0 0 20px rgba(33, 112, 228, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(33, 112, 228, 0);
            }
        }
        
        @keyframes icon-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .animate-entrance {
            animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .animate-pulse-ring {
            animation: soft-pulse 2.5s infinite;
        }
        
        .animate-float {
            animation: icon-float 3s ease-in-out infinite;
        }
        
        /* Level 2 Elevation per Style Guidance */
        .elevation-2 {
            box-shadow: 0 10px 25px rgba(23, 43, 77, 0.10);
        }
    </style>
