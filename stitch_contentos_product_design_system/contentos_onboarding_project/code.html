<style>
        body { font-family: 'Inter', sans-serif; }
        .bg-soft-gradient {
            background: linear-gradient(135deg, #f1f3ff 0%, #e8edff 100%);
        }
    </style>

<body class="bg-soft-gradient min-h-screen flex items-center justify-center p-gutter text-on-surface antialiased">
<!-- Main Container -->
<main class="w-full max-w-2xl bg-surface-container-lowest rounded-xl border border-surface-variant shadow-[0_10px_25px_rgba(23,43,77,0.10)] overflow-hidden relative">
<!-- Progress Bar -->
<div class="h-1 bg-surface-variant w-full">
<div class="h-full bg-primary w-2/5 transition-all duration-500 ease-in-out"></div>
</div>
<div class="p-xl flex flex-col gap-lg">
<!-- Header Section -->
<div class="text-center space-y-sm">
<span class="font-label-md text-label-md text-tertiary uppercase tracking-wider">Step 2 of 5</span>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Let's create your first project</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">
                    Projects help ContentOS organize your trends and AI models.
                </p>
</div>
<!-- Form Section -->
<form class="space-y-lg mt-md" onsubmit="event.preventDefault();">
<!-- Project Name -->
<div class="space-y-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant" for="projectName">Project Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-tertiary group-focus-within:text-primary transition-colors">folder</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-sm pl-[36px] pr-sm font-body-md text-body-md text-on-surface placeholder-tertiary focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all outline-none" id="projectName" name="projectName" placeholder="e.g., 'Tech Trends 2024'" type="text">
</div>
</div>
<!-- Niche Dropdown -->
<div class="space-y-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant" for="niche">Niche</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-tertiary group-focus-within:text-primary transition-colors">category</span>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-sm pl-[36px] pr-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all outline-none appearance-none" id="niche" name="niche">
<option disabled="" selected="" value="">Select a Niche</option>
<option value="tech">Tech</option>
<option value="lifestyle">Lifestyle</option>
<option value="business">Business</option>
<option value="finance">Finance</option>
<option value="health">Health</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-tertiary pointer-events-none">expand_more</span>
</div>
</div>
<!-- Target Audience -->
<div class="space-y-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant" for="audience">Target Audience</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-[10px] text-tertiary group-focus-within:text-primary transition-colors">groups</span>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-sm pl-[36px] pr-sm font-body-md text-body-md text-on-surface placeholder-tertiary focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all outline-none resize-none" id="audience" name="audience" placeholder="Describe who you're creating for..." rows="3"></textarea>
</div>
</div>
<!-- Actions -->
<div class="pt-md flex items-center justify-between border-t border-surface-variant">
<button class="font-label-md text-label-md text-tertiary hover:text-on-surface px-md py-sm rounded-lg hover:bg-surface-container-low transition-colors flex items-center gap-xs" type="button">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                        Back
                    </button>
<button class="bg-primary text-on-primary font-label-md text-label-md px-lg py-md rounded-lg hover:bg-primary-container transition-colors flex items-center gap-sm shadow-[0_2px_4px_rgba(23,43,77,0.05)] active:scale-95 duration-150" type="button">
                        Next: Brand Voice
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Decorative subtle element -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container opacity-5 blur-3xl -z-10 rounded-full pointer-events-none"></div>
</main>
<div id="snapdom-sandbox" data-snapdom-sandbox="true" aria-hidden="true" style="position: absolute; left: -9999px; top: -9999px; width: 0px; height: 0px; overflow: hidden;"></div></body></html>
