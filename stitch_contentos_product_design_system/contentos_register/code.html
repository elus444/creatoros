</div>
<!-- Work Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="workEmail">Work Email</label>
<input class="w-full h-12 px-md font-body-md text-body-md bg-transparent border border-[#DCE6F0] rounded outline-none transition-all input-glow text-on-surface placeholder-outline" id="workEmail" placeholder="jane@company.com" type="email">
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Password</label>
<input class="w-full h-12 px-md font-body-md text-body-md bg-transparent border border-[#DCE6F0] rounded outline-none transition-all input-glow text-on-surface placeholder-outline mb-xs" id="password" placeholder="••••••••" type="password">

<div class="h-1 w-full bg-outline-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/3"></div>
